apiVersion: apps/v1
kind: Deployment
metadata:
  name: drippycutz-backend
  labels:
    app: drippycutz-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: drippycutz-backend
  template:
    metadata:
      labels:
        app: drippycutz-backend
    spec:
      containers:
        - name: backend
          image: 374040432649.dkr.ecr.us-east-1.amazonaws.com/drippycutz-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: drippycutz-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
